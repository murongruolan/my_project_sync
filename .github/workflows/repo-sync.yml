name: Repo Sync

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    paths: ['project.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH + Git
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BACKUP_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global user.name "repo-sync-bot"
          git config --global user.email "repo-sync@murongruolan.local"
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"

      - name: Sync
        run: |
          BACKUP_REPO="git@github.com:murongruolan/exc_project_bak.git"
          SYNC_LOG="sync-log-$(date +%Y%m%d-%H%M%S).md"
          echo "# Sync Log $(date -u '+%Y-%m-%d %H:%M UTC')" > "$SYNC_LOG"

          REPOS=$(grep -vE '^\s*(#|$)' project.md | sed 's/\s*#.*//' | xargs)
          echo "Repos to sync: $REPOS"

          rm -rf /tmp/bak.git
          echo "DEBUG: attempting backup clone..."
          git clone --bare "$BACKUP_REPO" /tmp/bak.git 2>&1 || {
            echo "ERROR: backup clone failed" >> "$SYNC_LOG"
            cat "$SYNC_LOG"
            exit 1
          }

          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          for repo in $REPOS; do
            BRANCH=$(echo "$repo" | tr '/' '_')
            echo "### $repo" >> "$SYNC_LOG"
            echo "  Processing $repo (branch=$BRANCH)..." >&2

            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.github.com/repos/$repo" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "  SKIP: upstream unreachable (HTTP $HTTP_CODE)" >> "$SYNC_LOG"
              echo "" >> "$SYNC_LOG"
              continue
            fi

            UP_HEAD=$(curl -s "https://api.github.com/repos/$repo/commits?per_page=1" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['sha'] if d else '')" 2>/dev/null || echo "")
            if [ -z "$UP_HEAD" ]; then
              echo "  SKIP: cannot get upstream HEAD" >> "$SYNC_LOG"
              echo "" >> "$SYNC_LOG"
              continue
            fi

            rm -rf /tmp/upstream.git
            git clone --bare "https://github.com/$repo.git" /tmp/upstream.git 2>&1 || {
              echo "  SKIP: upstream clone failed" >> "$SYNC_LOG"
              echo "" >> "$SYNC_LOG"
              continue
            }

            UP_DEFAULT_BRANCH=$(git --git-dir=/tmp/upstream.git symbolic-ref HEAD 2>/dev/null | sed 's|refs/heads/||' || echo "main")
            UP_DEFAULT_HEAD=$(git --git-dir=/tmp/upstream.git rev-parse "refs/heads/$UP_DEFAULT" 2>/dev/null || echo "")

            BAK_HEAD=$(git --git-dir=/tmp/bak.git rev-parse "refs/heads/$BRANCH" 2>/dev/null || echo "")

            if [ -n "$BAK_HEAD" ]; then
              if git --git-dir=/tmp/bak.git merge-base --is-ancestor "$BAK_HEAD" "$UP_DEFAULT_HEAD" 2>/dev/null; then
                git --git-dir=/tmp/bak.git update-ref "refs/heads/$BRANCH" "$UP_DEFAULT_HEAD"
                echo "  fast-forward: ${BAK_HEAD:0:8} -> ${UP_DEFAULT_HEAD:0:8}" >> "$SYNC_LOG"
              else
                REWIND="${BRANCH}_rewritten_$(date +%Y%m%d)"
                git --git-dir=/tmp/bak.git update-ref "refs/heads/$REWIND" "$BAK_HEAD"
                git --git-dir=/tmp/bak.git update-ref "refs/heads/$BRANCH" "$UP_DEFAULT_HEAD"
                echo "  force-push detected: backup preserved at $REWIND" >> "$SYNC_LOG"
              fi
            else
              if [ -z "$UP_DEFAULT_HEAD" ]; then
                echo "  SKIP: upstream default HEAD is empty" >> "$SYNC_LOG"
                echo "" >> "$SYNC_LOG"
                continue
              fi
              git --git-dir=/tmp/bak.git update-ref "refs/heads/$BRANCH" "$UP_DEFAULT_HEAD" || {
                echo "  SKIP: cannot create backup branch" >> "$SYNC_LOG"
                echo "" >> "$SYNC_LOG"
                continue
              }
              echo "  first-backup: ${UP_DEFAULT_HEAD:0:8}" >> "$SYNC_LOG"
            fi

            FINAL=$(git --git-dir=/tmp/bak.git rev-parse "refs/heads/$BRANCH" 2>/dev/null || echo "")
            echo "  backup-head: $FINAL" >> "$SYNC_LOG"
            echo "" >> "$SYNC_LOG"
            rm -rf /tmp/upstream.git
          done

          cd /tmp/bak.git
          git push --all "$BACKUP_REPO" 2>&1 || true

      - name: Log
        if: always()
        run: |
          echo "=== Sync Log ==="
          cat sync-log-*.md 2>/dev/null || echo "(no log)"

      - name: Save log
        if: always()
        run: |
          mkdir -p logs
          for f in sync-log-*.md; do [ -f "$f" ] && cp "$f" logs/; done
          git add logs/
          git diff --cached --quiet || { git commit -m "sync log $(date -u '+%Y-%m-%d')"; git push; }
